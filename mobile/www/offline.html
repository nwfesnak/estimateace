<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EstimateAce — offline</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f4; color: #1e293b;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } p { color: #cbd5e1 !important; } }
    .card { max-width: 360px; }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #475569; margin: 0 0 24px; }
    button {
      appearance: none; border: 0; border-radius: 12px; background: #10b981; color: #fff;
      font-size: 17px; font-weight: 600; padding: 14px 28px; width: 100%;
    }
    button:active { background: #059669; }
    .status { font-size: 13px; margin-top: 14px; min-height: 18px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <img src="icon.png" alt="EstimateAce" />
    <h1>You're offline</h1>
    <p>EstimateAce couldn't reach the server. Check your Wi-Fi or cell signal, then try again. Nothing you saved is lost.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
  <script>
    var APP_URL = 'https://app.estimateace.com/';
    var statusEl = document.getElementById('status');
    function retry() {
      statusEl.textContent = 'Connecting…';
      window.location.replace(APP_URL);
    }
    document.getElementById('retry').addEventListener('click', retry);
    // Reconnect automatically when the connection comes back.
    window.addEventListener('online', retry);
  </script>
</body>
</html>
